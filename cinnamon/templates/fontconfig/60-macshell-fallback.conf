<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<!-- Installed only when Apple's SF fonts are not present: map the SF family names the
     MacShell UI asks for onto the freely licensed Open Runde font shipped with MacShell. -->
<fontconfig>
  <alias binding="same"><family>SF Pro Text</family><prefer><family>Open Runde</family></prefer></alias>
  <alias binding="same"><family>SF Pro Display</family><prefer><family>Open Runde</family></prefer></alias>
  <alias binding="same"><family>SF Pro Rounded</family><prefer><family>Open Runde</family></prefer></alias>
  <alias binding="same"><family>SF Mono</family><prefer><family>DejaVu Sans Mono</family></prefer></alias>
</fontconfig>
